repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: local
    hooks:
      - id: biome-check
        name: biome format and lint
        entry: bun run biome check --write --no-errors-on-unmatched
        language: system
        files: \.(cjs|cts|css|gql|graphql|js|json|jsonc|jsx|mjs|mts|ts|tsx)$
